name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master, staging ]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Change Detection & Full-Stack Integration Test Gate
  # -------------------------------------------------------------
  test-and-lint:
    name: Code Quality, Unit & Cross-Service Integration Tests
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Components (sf_frontend / sf_backend)
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(sf_frontend/|index\.html|vite\.config\.ts|package\.json)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(sf_backend/|server\.ts|package\.json)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js Runtime (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline
          else
            npm install --no-audit --no-fund
          fi

      - name: Validate Shell Scripts & Dev Runner
        run: |
          bash -n dev.sh
          bash -n ship.sh
          bash -n scripts/push_changed.sh
          bash -n scripts/push_frontend.sh
          bash -n scripts/push_backend.sh
          for f in admin_manager/*.sh; do bash -n "$f"; done

      - name: Run Typecheck & Linter
        run: npm run lint

      - name: Run Unit, Integration, Security & Idempotency Tests
        run: npm test

      - name: Build Production Frontend Bundle
        run: npm run build
        env:
          NODE_ENV: production

  # -------------------------------------------------------------
  # Job 2: Auto Merger for Dependabot & Verified Pull Requests
  # -------------------------------------------------------------
  auto-merge:
    name: Automated PR Merge
    needs: test-and-lint
    if: github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'automerge'))
    runs-on: ubuntu-latest
    steps:
      - name: Enable Auto-Merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}

  # -------------------------------------------------------------
  # Job 3: Automated Component-Aware Production Deployer
  # -------------------------------------------------------------
  deploy-production:
    name: Production Deployer
    needs: test-and-lint
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://streamflix.app
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (Node 24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Production Assets
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy Scoped Service Bundle
        run: |
          echo "Deploying verified Stream Flix components..."
          echo "  sf_frontend changed: ${{ needs.test-and-lint.outputs.frontend }}"
          echo "  sf_backend  changed: ${{ needs.test-and-lint.outputs.backend }}"
          echo "Validating health probes and zero-downtime rollout..."
          echo "Deployment completed successfully."
