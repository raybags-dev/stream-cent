user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  # Rate limit zones
  limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
  limit_req_status 429;

  # Docker embedded DNS: resolve the app service at request time so nginx
  # starts and recovers cleanly even when the app container is restarting.
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    # Security headers (TLS is terminated upstream at the ALB; HSTS belongs there)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 50m;
    client_body_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location /api/auth/ {
      limit_req zone=auth_per_ip burst=10 nodelay;
      set $streamflix_upstream http://app:3000;
      proxy_pass $streamflix_upstream;
    }

    location /api/ {
      limit_req zone=api_per_ip burst=40 nodelay;
      set $streamflix_upstream http://app:3000;
      proxy_pass $streamflix_upstream;
    }

    # Immutable hashed frontend assets
    location /assets/ {
      set $streamflix_upstream http://app:3000;
      proxy_pass $streamflix_upstream;
      expires 30d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      set $streamflix_upstream http://app:3000;
      proxy_pass $streamflix_upstream;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
